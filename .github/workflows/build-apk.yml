{
"name": "Build Android APK",
"on": {
"push": {
"branches": ["main"]
},
"workflow_dispatch": {}
},
"jobs": {
"build-apk": {
"runs-on": "ubuntu-latest",
"steps": [
{
"name": "Checkout repository",
"uses": "actions/checkout@v4"
},
{
"name": "Set up Node.js",
"uses": "actions/setup-node@v4",
"with": {
"node-version": "20"
}
},
{
"name": "Set up Java 21",
"uses": "actions/setup-java@v4",
"with": {
"distribution": "temurin",
"java-version": "21"
}
},
{
"name": "Build Capacitor Android APK",
"run": "mkdir -p appbuild/www && cp index.html appbuild/www/index.html && cd appbuild && echo '{"name":"homeswitch","version":"1.0.0"}' > package.json && npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 && npx cap init SwitchBotHub com.daz3691.homeswitch --web-dir www && npx cap add android && cd android && chmod +x gradlew && ./gradlew assembleDebug"
},
{
"name": "Upload APK",
"uses": "actions/upload-artifact@v4",
"with": {
"name": "SwitchBot-Climate-Hub-APK",
"path": "appbuild/android/app/build/outputs/apk/debug/app-debug.apk"
}
}
]
}
}
}
